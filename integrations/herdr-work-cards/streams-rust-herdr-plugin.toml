id = "streams-rust-work-cards"
name = "Streams Rust work cards"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Opt-in Rust projections for enrolled Pi sessions."
platforms = ["macos", "linux"]

[[panes]]
id = "card"
title = "Streams work card"
placement = "split"
command = ["/bin/sh", "bin/open-rust-streams-pane.sh"]

[[panes]]
id = "document"
title = "Document"
placement = "tab"
command = ["/bin/sh", "bin/open-document.sh"]

[[panes]]
id = "artifact"
title = "Session output"
placement = "tab"
command = ["/bin/sh", "bin/open-artifact.sh"]
