id = "streams-work-cards"
name = "Streams work cards"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Read-only Streams projections for enrolled Pi sessions."
platforms = ["macos", "linux"]

[[panes]]
id = "card"
title = "Streams work card"
placement = "split"
command = ["node", "dist/herdr/streams-pane.js"]

[[panes]]
id = "document"
title = "Document"
placement = "tab"
command = ["/bin/sh", "bin/open-document.sh"]
