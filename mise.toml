[tools]
node = "26"
uv = "latest"
rust = "1.95.0"

[env]
# Temper has its own toolchain file; use one compiler for the entire Cargo graph.
RUSTUP_TOOLCHAIN = "1.95.0"

[tasks."test:rust"]
description = "Run Rust catalog, documentation and Temper verification tests (requires Z3 and libclang)"
run = [
  'RUSTC=$(rustup which rustc) RUSTDOC=$(rustup which rustdoc) cargo test --locked --all-targets',
  'RUSTC=$(rustup which rustc) RUSTDOC=$(rustup which rustdoc) cargo test --locked --doc',
]

[tasks."test:differential"]
description = "Compare Python and Rust durable catalog traces"
run = [
  'RUSTC=$(rustup which rustc) RUSTDOC=$(rustup which rustdoc) cargo build --locked --example catalog_trace',
  "uv run python -m unittest discover -s tests/python -p test_rust_differential.py",
]

[tasks."test:python"]
description = "Run streams CLI unit tests"
run = "uv run python -m unittest discover tests/python"

[tasks."test:pi"]
description = "Run Pi checkpoint extension tests"
run = "node --test tests/stream_checkpoint_test.mjs tests/stream_sync_test.mjs tests/stream_outcomes_test.mjs tests/stream_native_test.mjs"

[tasks."test:herdr"]
description = "Run native Herdr work-card regression tests"
run = "npm --prefix integrations/herdr-work-cards test"

[tasks.test]
description = "Run all tests"
depends = ["test:rust", "test:differential", "test:python", "test:pi", "test:herdr"]
