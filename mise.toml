[tools]
node = "26"
uv = "latest"
rust = "1.95.0"

[env]
# Temper has its own toolchain file; use one compiler for the entire Cargo graph.
RUSTUP_TOOLCHAIN = "1.95.0"

[tasks."test:fast"]
description = "Development gate: Rust contracts and Pi tests, no Git publication/parity runs"
depends = ["test:rust:fast", "test:pi"]

[tasks."test:rust:fast"]
# Fixture repositories must not inherit personal hooks, fsmonitor or signing policy.
env = { GIT_CONFIG_GLOBAL = "/dev/null", GIT_CONFIG_SYSTEM = "/dev/null", GIT_CONFIG_NOSYSTEM = "1" }
description = "Run Rust contracts in one harness; filter with cargo test --test contracts <module>"
run = 'RUSTC=$(rustup which rustc) RUSTDOC=$(rustup which rustdoc) cargo test --locked --lib --bins --test contracts -- --test-threads=4'

[tasks."test:build"]
description = "Build production Rust CLI and differential probes once per task graph"
run = 'RUSTC=$(rustup which rustc) RUSTDOC=$(rustup which rustdoc) cargo build --locked --examples --bin streams'

[tasks."test:rust"]
env = { GIT_CONFIG_GLOBAL = "/dev/null", GIT_CONFIG_SYSTEM = "/dev/null", GIT_CONFIG_NOSYSTEM = "1" }
description = "Run Rust catalog, documentation and Temper verification tests (requires Z3 and libclang)"
run = [
  'RUSTC=$(rustup which rustc) RUSTDOC=$(rustup which rustdoc) cargo test --locked --all-targets -- --test-threads=4',
  'RUSTC=$(rustup which rustc) RUSTDOC=$(rustup which rustdoc) cargo test --locked --doc',
]

[tasks."test:differential"]
env = { GIT_CONFIG_GLOBAL = "/dev/null", GIT_CONFIG_SYSTEM = "/dev/null", GIT_CONFIG_NOSYSTEM = "1" }
description = "Compare Python and Rust catalog traces and CLI contracts (including Git)"
depends = ["test:build"]
run = "uv run python tests/python/suites.py differential"

[tasks."test:python"]
env = { GIT_CONFIG_GLOBAL = "/dev/null", GIT_CONFIG_SYSTEM = "/dev/null", GIT_CONFIG_NOSYSTEM = "1" }
description = "Run Python reference tests only; differential tests have their own gate"
run = "uv run python tests/python/suites.py reference"

[tasks."test:pi"]
description = "Run Pi checkpoint extension tests"
run = "node --test tests/stream_checkpoint_test.mjs tests/stream_sync_test.mjs tests/stream_outcomes_test.mjs tests/stream_native_test.mjs tests/stream_prompt_replay_test.mjs tests/stream_debug_settings_test.mjs"

[tasks."test:replay"]
description = "Replay production Pi helpers through the Rust CLI in isolated homes"
depends = ["test:build"]
run = "node --test tests/stream_rust_replay_test.mjs"

[tasks."test:native:rust"]
description = "Exercise Pi native routing and launch assets through an isolated Rust CLI"
depends = ["test:build"]
run = "node --test tests/stream_rust_native_test.mjs"

[tasks."test:herdr"]
description = "Run native Herdr work-card regression tests"
run = "npm --prefix integrations/herdr-work-cards test"

[tasks.test]
description = "Full acceptance: every Rust/reference/parity/Pi/Herdr/replay test, without duplicate parity runs"
depends = ["test:rust", "test:differential", "test:python", "test:pi", "test:herdr", "test:replay", "test:native:rust"]
