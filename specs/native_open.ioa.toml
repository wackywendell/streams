# Native workspace open begins only after its durable attempt has been written.
# Each effect is journalled before dispatch; only checked acknowledgements allow
# another effect or a ready binding. Uncertainty is terminal for this attempt.
[automaton]
name = "NativeOpen"
states = ["Prepared", "Dispatching", "Acknowledged", "Bound", "Complete", "Uncertain"]
initial = "Prepared"
terminal = ["Complete", "Uncertain"]

[[state]]
name = "marker"
type = "bool"
initial = true

[[state]]
name = "pending"
type = "bool"
initial = false

[[state]]
name = "ready"
type = "bool"
initial = false

[[action]]
name = "Dispatch"
kind = "input"
from = ["Prepared", "Acknowledged"]
to = "Dispatching"
guard = "marker && !pending && !ready"
effect = ["pending = true"]

[[action]]
name = "Acknowledge"
kind = "internal"
from = ["Dispatching"]
to = "Acknowledged"
guard = "marker && pending && !ready"
effect = ["pending = false"]

[[action]]
name = "Bind"
kind = "internal"
from = ["Prepared", "Acknowledged"]
to = "Bound"
guard = "marker && !pending && !ready"
effect = ["ready = true"]

[[action]]
name = "Complete"
kind = "internal"
from = ["Bound"]
to = "Complete"
guard = "marker && !pending && ready"
effect = ["marker = false"]

[[action]]
name = "Fail"
kind = "internal"
from = ["Prepared", "Dispatching", "Acknowledged", "Bound"]
to = "Uncertain"
guard = "marker"
effect = ["marker = true"]

[[invariant]]
name = "DispatchRequiresDurableAttempt"
assert = "status in ['Dispatching'] => marker && pending && !ready"

[[invariant]]
name = "ReadyBindingRequiresAllAcknowledgements"
assert = "ready => !pending"

[[invariant]]
name = "BoundRequiresAcknowledgements"
assert = "status in ['Bound'] => ready && marker && !pending"

[[invariant]]
name = "CompletionRequiresReadyBinding"
assert = "status in ['Complete'] => ready && !marker && !pending"

[[invariant]]
name = "IncompleteAttemptRetainsMarker"
assert = "status in ['Prepared', 'Dispatching', 'Acknowledged', 'Bound', 'Uncertain'] => marker"
