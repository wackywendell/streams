# Resource-effect model under the superseded fixed-membership proposal.
# Does NOT establish the current ADR's membership history or per-card result admission.
# NOT wired into the production effect engine.
# One enrolled logical conversation/lifetime; addresses are abstract equality
# classes, not literal pane IDs. Every External* action is an admissible input
# in every non-retired phase, including while an adoption is being prepared.
# Attest/Commit abstract fresh identity evidence, locks and revision CAS; Rust
# must eventually carry concrete witnesses. See docs/native-context-reconciliation.md.
[automaton]
name = "NativeReconciliation"
states = ["Observing", "Candidate", "Active", "Retired"]
initial = "Observing"
terminal = ["Retired"]

[[state]]
name = "same_conversation"
type = "bool"
initial = true

[[state]]
name = "same_terminal"
type = "bool"
initial = true

[[state]]
name = "endpoint_verified"
type = "bool"
initial = true

[[state]]
name = "destination_clear"
type = "bool"
initial = true

# True only if adopting the owner location preserves the single-workspace law:
# same workspace, or the complete bound arrangement relocated and source retired.
[[state]]
name = "relocation_safe"
type = "bool"
initial = true

[[state]]
name = "fresh"
type = "bool"
initial = false

[[state]]
name = "manual_name"
type = "bool"
initial = false

[[state]]
name = "manual_overwritten"
type = "bool"
initial = false

[[state]]
name = "card_present"
type = "bool"
initial = true

[[state]]
name = "card_closed"
type = "bool"
initial = false

[[state]]
name = "card_separated"
type = "bool"
initial = false

[[state]]
name = "card_pending"
type = "bool"
initial = false

[[state]]
name = "card_uncertain"
type = "bool"
initial = false

[[state]]
name = "card_duplicate"
type = "bool"
initial = false

[[state]]
name = "editor_present"
type = "bool"
initial = true

[[state]]
name = "editor_closed"
type = "bool"
initial = false

[[state]]
name = "editor_separated"
type = "bool"
initial = false

[[state]]
name = "editor_pending"
type = "bool"
initial = false

[[state]]
name = "editor_uncertain"
type = "bool"
initial = false

[[state]]
name = "editor_duplicate"
type = "bool"
initial = false

# Environment transitions invalidate any candidate/permit. None depends on
# permission from Streams; they are not violations of the Streams protocol.
# Relevant interruptions also invalidate an in-flight reopen's receipt context.
# Under the retention invariants, uncertain implies pending, so assigning
# uncertain = pending preserves earlier uncertainty without an OR effect.
[[action]]
name = "ExternalOwnerMove"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "card_uncertain = card_pending", "editor_uncertain = editor_pending"]
hint = "Tab change or new workspace-qualified pane ID, same terminal/conversation; adoption still needs fresh attestation."

[[action]]
name = "ExternalSplitArrangement"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "relocation_safe = false", "card_uncertain = card_pending", "editor_uncertain = editor_pending"]

[[action]]
name = "ExternalArrangementReunited"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "relocation_safe = true"]
hint = "Complete inventory now proves source/destination satisfy the single-workspace law, not just one moved pane."

[[action]]
name = "ExternalRename"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "manual_name = true"]

[[action]]
name = "ExternalUnavailable"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "endpoint_verified = false", "card_uncertain = card_pending", "editor_uncertain = editor_pending"]
hint = "Unknown/partial observation, not evidence of closure."

[[action]]
name = "ExternalRestartOrRestore"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "endpoint_verified = false", "card_closed = false", "editor_closed = false", "card_uncertain = card_pending", "editor_uncertain = editor_pending"]

[[action]]
name = "ExternalRecycledHandle"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "same_terminal = false", "endpoint_verified = false", "card_uncertain = card_pending", "editor_uncertain = editor_pending"]
hint = "Same textual handle but different live terminal/process incarnation; cannot recover this old lifetime."

[[action]]
name = "ExternalDestinationClaimed"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "destination_clear = false", "card_uncertain = card_pending", "editor_uncertain = editor_pending"]

[[action]]
name = "ExternalDestinationReleased"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "destination_clear = true"]

[[action]]
name = "ExternalCardMove"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "card_separated = true", "card_uncertain = card_pending"]

[[action]]
name = "ExternalCardReturn"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "card_separated = false", "card_uncertain = card_pending"]

[[action]]
name = "ExternalEditorMove"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "editor_separated = true", "editor_uncertain = editor_pending"]

[[action]]
name = "ExternalEditorReturn"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "editor_separated = false", "editor_uncertain = editor_pending"]

[[action]]
name = "ExternalCardClose"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "card_present = false", "card_closed = false", "card_separated = false", "card_uncertain = card_pending"]

[[action]]
name = "ExternalEditorClose"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "editor_present = false", "editor_closed = false", "editor_separated = false", "editor_uncertain = editor_pending"]

[[action]]
name = "ExternalCardReappears"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "card_present = true", "card_closed = false", "card_uncertain = card_pending"]

[[action]]
name = "ExternalEditorReappears"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "editor_present = true", "editor_closed = false", "editor_uncertain = editor_pending"]

[[action]]
name = "ExternalCardLaunchUncertain"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "card_pending = true", "card_uncertain = true"]

[[action]]
name = "ExternalEditorLaunchUncertain"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "editor_pending = true", "editor_uncertain = true"]

[[action]]
name = "ExternalTreeNavigation"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "editor_uncertain = editor_pending"]
hint = "Same conversation, new active branch; captured report/document/shortcut preconditions expire."

[[action]]
name = "ExternalForkOrSwitch"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Retired"
guard = "true"
effect = ["fresh = false", "same_conversation = false"]
hint = "Committed replacement only. New UUID gets a separate unenrolled lifetime; never retarget the old one."

# These are evidence-consuming boundaries, not raw observations or cached flags.
[[action]]
name = "ReattestSurvivingEndpoint"
kind = "internal"
from = ["Observing"]
to = "Observing"
guard = "same_conversation && same_terminal"
effect = ["endpoint_verified = true"]
hint = "Fresh current-endpoint/process evidence of the original incarnation, never a saved handle alone."

[[action]]
name = "AttestUnderLocks"
kind = "internal"
from = ["Observing"]
to = "Candidate"
guard = "same_conversation && same_terminal && endpoint_verified && destination_clear && relocation_safe && !card_pending && !editor_pending"
effect = ["fresh = true"]

[[action]]
name = "CommitAdoption"
kind = "internal"
from = ["Candidate"]
to = "Active"
guard = "fresh && same_conversation && same_terminal && endpoint_verified && destination_clear && relocation_safe && !card_pending && !editor_pending"
effect = []
hint = "CAS exact old/new revisions and locked ownership; persist lineage without deleting predecessor launch evidence."

[[action]]
name = "ExternalCasLost"
kind = "input"
from = ["Observing", "Candidate", "Active"]
to = "Observing"
guard = "true"
effect = ["fresh = false", "card_uncertain = card_pending", "editor_uncertain = editor_pending"]

[[action]]
name = "ConfirmCardClosure"
kind = "internal"
from = ["Observing"]
to = "Observing"
guard = "endpoint_verified && !card_present"
effect = ["card_closed = true"]
hint = "Complete identity-verified inventory and exact old resource evidence, not a missing observation."

[[action]]
name = "ConfirmEditorClosure"
kind = "internal"
from = ["Observing"]
to = "Observing"
guard = "endpoint_verified && !editor_present"
effect = ["editor_closed = true"]

[[action]]
name = "ProjectAutomaticName"
kind = "internal"
from = ["Active"]
to = "Active"
guard = "!manual_name"
effect = ["manual_overwritten = manual_name"]

[[action]]
name = "ExplicitNameReclaim"
kind = "input"
from = ["Active"]
to = "Active"
guard = "manual_name"
effect = ["manual_name = false"]
hint = "Explicit user choice for this exact freshly attested naming surface only."

[[action]]
name = "FocusExistingCard"
kind = "input"
from = ["Active"]
to = "Active"
guard = "card_present && !card_separated"
effect = []

[[action]]
name = "FocusExistingEditor"
kind = "input"
from = ["Active"]
to = "Active"
guard = "editor_present && !editor_separated"
effect = []

# Explicit, revalidated user requests. No automatic reopen action exists.
# Success acknowledgements abstract NativeOpen's checked nonce/resource receipt;
# an ambiguous dispatch has no such transition and retains its marker forever.
[[action]]
name = "ExplicitReopenCard"
kind = "input"
from = ["Active"]
to = "Observing"
guard = "card_closed && !card_present && !card_pending"
effect = ["card_duplicate = card_present", "card_pending = true", "fresh = false"]

[[action]]
name = "ExplicitReopenEditor"
kind = "input"
from = ["Active"]
to = "Observing"
guard = "editor_closed && !editor_present && !editor_pending"
effect = ["editor_duplicate = editor_present", "editor_pending = true", "fresh = false"]

[[action]]
name = "AcknowledgeCardReopen"
kind = "internal"
from = ["Observing"]
to = "Observing"
guard = "card_pending && !card_uncertain && !card_present && same_terminal && same_conversation && endpoint_verified && destination_clear && relocation_safe"
effect = ["card_pending = false", "card_present = true", "card_closed = false", "card_separated = false"]

[[action]]
name = "AcknowledgeEditorReopen"
kind = "internal"
from = ["Observing"]
to = "Observing"
guard = "editor_pending && !editor_uncertain && !editor_present && same_terminal && same_conversation && endpoint_verified && destination_clear && relocation_safe"
effect = ["editor_pending = false", "editor_present = true", "editor_closed = false", "editor_separated = false"]

[[invariant]]
name = "EffectsRequireCurrentIdentityAndExclusiveAdoption"
assert = "status in ['Active'] => fresh && same_conversation && same_terminal && endpoint_verified && destination_clear && relocation_safe && !card_pending && !editor_pending"

[[invariant]]
name = "UncertainCardEvidenceSurvivesEveryExternalChange"
assert = "card_uncertain => card_pending"

[[invariant]]
name = "UncertainEditorEvidenceSurvivesEveryExternalChange"
assert = "editor_uncertain => editor_pending"

[[invariant]]
name = "NoDuplicateReopen"
assert = "!card_duplicate && !editor_duplicate"

[[invariant]]
name = "ClosureProofIsNotLivePresence"
assert = "(card_closed => !card_present) && (editor_closed => !editor_present)"

[[invariant]]
name = "ManualNamesSurviveAdoption"
assert = "!manual_overwritten"

[[invariant]]
name = "ReplacementCannotReuseOldLifetime"
assert = "status in ['Retired'] => !fresh && !same_conversation"
