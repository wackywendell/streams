name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npm --prefix integrations/herdr-work-cards ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libz3-dev libclang-dev pkg-config
      - if: runner.os == 'macOS'
        run: brew install z3 pkg-config
      - run: mise run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run build
      - run: npm ci
      - run: npm --prefix integrations/herdr-work-cards ci --ignore-scripts
      - run: npm pack --dry-run
