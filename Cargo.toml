[package]
name = "streams-temper"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Streams durable catalog and synchronization protocol backed by Temper IOA verification"
autotests = false

[[bin]]
name = "streams"
path = "src/main.rs"

[[test]]
name = "contracts"
path = "tests/contracts.rs"

[[test]]
name = "verification"
path = "tests/verification.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-core = "0.3"
icu_casemap = "2"
libc = "0.2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
percent-encoding = "2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
signal-hook = "0.3"
unicode-general-category = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
saneyaml = "0.3.1"
sha2 = "0.10"
tempfile = "3"
temper-jit = { git = "https://github.com/nerdsane/temper.git", rev = "6255ac3b43028105b8c0a2cee773f01aed2480a2" }
temper-spec = { git = "https://github.com/nerdsane/temper.git", rev = "6255ac3b43028105b8c0a2cee773f01aed2480a2" }
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
strum = { version = "0.28.0", features = ["derive"] }

[dev-dependencies]
proptest = "1"
stateright = "0.31"
vt100 = "0.15"
temper-runtime = { git = "https://github.com/nerdsane/temper.git", rev = "6255ac3b43028105b8c0a2cee773f01aed2480a2" }
temper-verify = { git = "https://github.com/nerdsane/temper.git", rev = "6255ac3b43028105b8c0a2cee773f01aed2480a2" }

# Keep the same formal exploration; optimize its CPU-heavy test engines only.
[profile.test.package.temper-jit]
opt-level = 1

[profile.test.package.temper-verify]
opt-level = 1

[profile.test.package.stateright]
opt-level = 1
